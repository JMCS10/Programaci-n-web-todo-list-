<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    padding: 10px;
    background: #f4f4f4;
}

h1 {
    text-align: center;
}

.form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input, button {
    padding: 12px;
    font-size: 16px;
}

button {
    background: #007bff;
    color: white;
    border: none;
}

.item {
    background: white;
    padding: 10px;
    margin-top: 10px;
}

.completado {
    text-decoration: line-through;
    color: gray;
}

.acciones {
    margin-top: 5px;
}

.btn-eliminar {
    background: red;
}

.btn-editar {
    background: orange;
}
</style>

</head>
<body>

<h1>Todo List</h1>

<div class="form">
    <input type="text" id="descripcion" placeholder="Descripción">
    <button onclick="agregarTarea()">Añadir</button>
</div>

<div id="lista"></div>

<script>
var tareas = [];
var editando = -1;


function obtenerFechaHoy() {
    var hoy = new Date();
    return hoy.toLocaleDateString();
}


function guardar() {
    localStorage.setItem("tareas", JSON.stringify(tareas));
}


function cargar() {
    var data = localStorage.getItem("tareas");
    if (data != null) {
        tareas = JSON.parse(data);
        mostrar();
    }
}

function mostrar() {
    var lista = document.getElementById("lista");
    lista.innerHTML = "";

    for (var i = 0; i < tareas.length; i++) {

        var tarea = tareas[i];

        var texto = "";

        texto += "<div class='item'>";
        texto += "<label>";
        texto += "<input type='checkbox' onchange='cambiarEstado(" + i + ")'";

        if (tarea.completado) {
            texto += " checked";
        }

        texto += ">";

        if (tarea.completado) {
            texto += "<span class='completado'>" + tarea.descripcion + "</span>";
        } else {
            texto += "<span>" + tarea.descripcion + "</span>";
        }

        texto += "</label>";
        texto += "<p>Fecha: " + tarea.fecha + "</p>";

        texto += "<div class='acciones'>";
        texto += "<button class='btn-editar' onclick='editar(" + i + ")'>Editar</button>";
        texto += "<button class='btn-eliminar' onclick='eliminar(" + i + ")'>Eliminar</button>";
        texto += "</div>";

        texto += "</div>";

        lista.innerHTML += texto;
    }
}

function agregarTarea() {
    var desc = document.getElementById("descripcion").value;

    if (desc == "") {
        alert("Ingrese una descripcion");
        return;
    }

    if (editando == -1) {
        var nueva = {
            descripcion: desc,
            fecha: obtenerFechaHoy(),
            completado: false
        };
        tareas.push(nueva);
    } else {
        tareas[editando].descripcion = desc;
        editando = -1;
    }

    guardar();
    mostrar();
    document.getElementById("descripcion").value = "";
}

function eliminar(index) {
    tareas.splice(index, 1);
    guardar();
    mostrar();
}

function editar(index) {
    document.getElementById("descripcion").value = tareas[index].descripcion;
    editando = index;
}

function cambiarEstado(index) {
    if (tareas[index].completado) {
        tareas[index].completado = false;
    } else {
        tareas[index].completado = true;
    }
    guardar();
    mostrar();
}

cargar();
</script>

</body>
</html>
